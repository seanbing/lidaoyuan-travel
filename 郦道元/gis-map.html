<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>郦道元行旅中国｜GIS 水墨历史地图</title>
    <link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
    <style>
      :root {
        --paper: #efe8d5;
        --paper-deep: #d4c19c;
        --ink: #25211b;
        --muted: #695f50;
        --river: #4f91a6;
        --route: #9b4b35;
        --seal: #9d3429;
        --panel-line: rgba(96, 75, 48, 0.26);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        color: var(--ink);
        background: #bca987;
        font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
      }

      button {
        font: inherit;
      }

      .page {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(circle at 56% 24%, rgba(255, 252, 239, 0.9), transparent 34%),
          radial-gradient(circle at 72% 58%, rgba(92, 145, 157, 0.17), transparent 28%),
          linear-gradient(90deg, rgba(74, 56, 34, 0.24), transparent 12%, transparent 88%, rgba(74, 56, 34, 0.18)),
          repeating-linear-gradient(90deg, rgba(92, 71, 42, 0.045) 0 1px, transparent 1px 9px),
          repeating-linear-gradient(0deg, rgba(130, 103, 66, 0.03) 0 1px, transparent 1px 11px),
          var(--paper);
      }

      .page::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        background:
          linear-gradient(90deg, rgba(58, 43, 27, 0.12), transparent 9%, transparent 92%, rgba(58, 43, 27, 0.1)),
          radial-gradient(circle at 30% 38%, rgba(72, 91, 77, 0.08), transparent 24%),
          radial-gradient(circle at 86% 24%, rgba(71, 93, 87, 0.13), transparent 21%);
        mix-blend-mode: multiply;
      }

      .page::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 20;
        pointer-events: none;
        box-shadow:
          inset 0 0 70px rgba(76, 57, 33, 0.2),
          inset 0 0 0 1px rgba(101, 78, 48, 0.22);
      }

      .masthead {
        position: absolute;
        z-index: 12;
        left: 18%;
        right: 18%;
        top: 2.4%;
        text-align: center;
        pointer-events: none;
      }

      .masthead h1 {
        margin: 0;
        font-family: "STXingkai", "KaiTi", "Kaiti SC", serif;
        font-size: clamp(42px, 6vw, 96px);
        line-height: 1;
        letter-spacing: 0;
        text-shadow: 0 5px 12px rgba(65, 47, 26, 0.14);
      }

      .masthead p {
        margin: 12px 0 0;
        color: #40372e;
        font-size: clamp(14px, 1.5vw, 24px);
      }

      .map-shell {
        position: absolute;
        left: 23.5%;
        right: 0;
        top: 0;
        bottom: 18.2%;
        z-index: 1;
        overflow: hidden;
        border-left: 1px solid rgba(92, 72, 46, 0.24);
      }

      .map-shell::before,
      /* .map-shell::after {
        content: "";
        position: absolute;
        pointer-events: none;
        z-index: 4;
        opacity: 0.34;
        background-image: url("./Data/山贴图.png");
        background-repeat: no-repeat;
        background-size: contain;
        filter: sepia(0.48) saturate(0.35) brightness(1.18) contrast(0.82);
        mix-blend-mode: multiply;
      } */

      .map-shell::before {
        left: -7%;
        top: 10%;
        width: 42%;
        height: 55%;
        transform: scaleX(-1);
      }

      .map-shell::after {
        right: -4%;
        top: 1%;
        width: 39%;
        height: 48%;
      }

      #map {
        width: 100%;
        height: 100%;
        background: transparent;
        filter: saturate(0.72) contrast(0.9) sepia(0.18);
      }

      .leaflet-container {
        background: transparent;
        font-family: inherit;
      }

      .leaflet-control-attribution {
        display: none;
      }

      .leaflet-pane.leaflet-marker-pane,
      .leaflet-pane.leaflet-overlay-pane {
        mix-blend-mode: multiply;
      }

      .art-layer {
        position: absolute;
        z-index: 6;
        pointer-events: none;
        background-repeat: no-repeat;
        background-size: contain;
        opacity: 0.38;
        mix-blend-mode: multiply;
        filter: sepia(0.28) saturate(0.5) brightness(1.12);
      }

      /* .art-layer.left-mountain {
        left: 18.8%;
        bottom: 18.4%;
        width: 28%;
        height: 28%;
        background-image: url("./Data/山贴图.png");
        transform: scaleX(-1);
      } */
/* 
      .art-layer.right-mountain {
        right: 1.2%;
        bottom: 17.8%;
        width: 30%;
        height: 36%;
        background-image: url("./Data/山贴图.png");
      } */

      .art-layer.boat {
        right: 31%;
        bottom: 18.7%;
        width: 8.5%;
        height: 10%;
        opacity: 0.34;
        background-image: url("./Data/封面船只.png");
        filter: sepia(0.35) saturate(0.7) brightness(1.05);
      }

      .side-panel {
        position: absolute;
        z-index: 14;
        display: flex;
        flex-direction: column;
        top: 0;
        bottom: 0;
        left: 0;
        width: 23.5%;
        min-width: 320px;
        padding: 2.2vh 18px 18px;
        border-right: 1px solid var(--panel-line);
        border-left: 1px solid rgba(255, 252, 238, 0.42);
        background:
          linear-gradient(90deg, rgba(214, 198, 163, 0.58), rgba(246, 237, 215, 0.78)),
          radial-gradient(circle at 45% 4%, rgba(98, 115, 92, 0.18), transparent 18%),
          radial-gradient(circle at 48% 94%, rgba(83, 106, 87, 0.2), transparent 20%),
          var(--paper);
        box-shadow: inset -15px 0 28px rgba(88, 69, 44, 0.07);
      }

      .side-panel::before,
      /* .side-panel::after {
        content: "";
        position: absolute;
        left: 12px;
        right: 12px;
        background-image: url("./Data/山贴图.png");
        background-repeat: no-repeat;
        background-size: contain;
        opacity: 0.22;
        filter: sepia(0.6) saturate(0.3) brightness(1.2);
        mix-blend-mode: multiply;
        pointer-events: none;
      } */

      .side-panel::before {
        top: 1.5%;
        height: 17%;
      }

      .side-panel::after {
        bottom: 3%;
        height: 17%;
        transform: scaleX(-1);
      }

      .side-panel h2,
      .legend h3 {
        margin: 0;
        font-size: 18px;
        line-height: 1.25;
        text-align: center;
      }

      .mini-map {
        position: relative;
        flex: 1 1 auto;
        min-height: 250px;
        margin: 12px 0 0;
        border: 1px solid var(--panel-line);
        border-radius: 4px;
        background:
          radial-gradient(circle at 64% 58%, rgba(151, 84, 55, 0.12), transparent 18%),
          linear-gradient(135deg, rgba(255, 250, 235, 0.7), rgba(216, 199, 166, 0.58));
        overflow: hidden;
        box-shadow: inset 0 0 18px rgba(77, 58, 34, 0.08);
      }

      .mini-map svg {
        width: 100%;
        height: 100%;
      }

      .side-route-figure {
        position: relative;
        flex: 1 1 auto;
        min-height: 250px;
        margin-top: 12px;
        overflow: hidden;
        border: 1px solid var(--panel-line);
        background: rgba(244, 235, 214, 0.72);
      }

      .side-route-figure img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
        object-position: top center;
        mix-blend-mode: multiply;
      }

      .legend {
        flex: 0 0 auto;
      }

      .legend h3,
      .legend ul {
        display: none;
      }

      .legend ul {
        list-style: none;
        margin: 14px 0 0;
        padding: 0;
        display: grid;
        gap: 12px;
        color: var(--muted);
        font-size: 14px;
      }

      .legend li {
        display: grid;
        grid-template-columns: 32px 1fr;
        align-items: center;
        gap: 9px;
      }

      .legend-symbol {
        display: block;
        width: 30px;
        height: 18px;
        position: relative;
      }

      .legend-symbol.route {
        border-top: 2px dashed var(--route);
      }

      .legend-symbol.river {
        border-top: 3px solid var(--river);
        border-radius: 999px;
      }

      .legend-symbol.city::before {
        content: "";
        position: absolute;
        left: 10px;
        top: 2px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 3px solid rgba(156, 59, 42, 0.72);
        background: #fff8e8;
      }

      .legend-symbol.mountain::before {
        content: "山";
        position: absolute;
        inset: -4px 0 0;
        color: #687264;
        font-weight: 700;
        text-align: center;
      }

      .layer-toggle {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 10px;
        padding: 10px 12px;
        border: 1px solid rgba(104, 82, 53, 0.18);
        border-radius: 999px;
        color: #4f4639;
        background: rgba(248, 240, 220, 0.68);
        font-size: 14px;
        cursor: pointer;
        user-select: none;
      }

      .layer-toggle input {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        opacity: 0;
        pointer-events: none;
      }

      .toggle-track {
        position: relative;
        width: 44px;
        height: 24px;
        flex: 0 0 auto;
        border: 1px solid rgba(104, 82, 53, 0.28);
        border-radius: 999px;
        background: rgba(174, 157, 126, 0.35);
        transition: background 180ms ease, border-color 180ms ease;
      }

      .toggle-track::after {
        content: "";
        position: absolute;
        left: 3px;
        top: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #f7eed9;
        box-shadow: 0 1px 4px rgba(76, 57, 33, 0.22);
        transition: transform 180ms ease;
      }

      .layer-toggle input:checked + .toggle-track {
        border-color: rgba(65, 132, 151, 0.52);
        background: rgba(82, 143, 161, 0.58);
      }

      .layer-toggle input:checked + .toggle-track::after {
        transform: translateX(20px);
      }

      .story-card {
        position: relative;
        z-index: 2;
        width: 100%;
        min-height: 0;
        flex: 0 0 auto;
        margin: 0;
        padding: 15px 18px 16px;
        border: 1px solid var(--panel-line);
        border-radius: 8px;
        background:
          linear-gradient(rgba(255, 251, 238, 0.86), rgba(235, 222, 197, 0.76)),
          var(--paper);
        box-shadow:
          inset 0 0 0 5px rgba(255, 252, 238, 0.34),
          inset 0 0 18px rgba(93, 70, 41, 0.1),
          0 12px 28px rgba(65, 50, 33, 0.12);
      }

      .story-card::after {
        content: "";
        position: absolute;
        inset: 8px;
        border: 1px solid rgba(105, 82, 52, 0.12);
        border-radius: 6px;
        pointer-events: none;
      }

      .story-ribbon {
        position: relative;
        display: grid;
        place-items: center;
        width: 154px;
        height: 31px;
        margin: 0 auto 12px;
        color: #fff7e8;
        background: linear-gradient(90deg, #8e604a, #a8765c);
        border-radius: 9px;
        font-size: 16px;
        letter-spacing: 0;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
      }

      .story-ribbon::before,
      .story-ribbon::after {
        content: "";
        position: absolute;
        top: 50%;
        width: 45px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(139, 90, 65, 0.72));
      }

      .story-ribbon::before {
        right: 100%;
        transform: translateY(-50%) scaleX(-1);
      }

      .story-ribbon::after {
        left: 100%;
        transform: translateY(-50%);
      }

      .story-card h2 {
        margin: 0 0 9px;
        font-size: clamp(17px, 1.3vw, 22px);
        line-height: 1.35;
        letter-spacing: 0;
      }

      .story-card p {
        margin: 0;
        color: #4c4338;
        font-size: 14px;
        line-height: 1.72;
        max-width: none;
      }

      .story-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 9px;
      }

      .story-meta span {
        padding: 4px 9px;
        border: 1px solid rgba(103, 82, 54, 0.22);
        border-radius: 999px;
        color: #5d5143;
        background: rgba(235, 222, 198, 0.65);
        font-size: 13px;
      }

      .story-figure {
        position: relative;
        height: clamp(92px, 13vh, 132px);
        margin-top: 10px;
        overflow: hidden;
        border-radius: 5px;
        background: rgba(228, 216, 190, 0.52);
      }

      .story-figure img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
        opacity: 0.82;
        filter: sepia(0.16) saturate(0.72) brightness(1.08);
        mix-blend-mode: multiply;
      }

      .classic-card {
        position: absolute;
        z-index: 18;
        right: 1.6%;
        top: 23.5%;
        width: min(31vw, 500px);
        padding: 20px 26px 22px;
        border: 1px solid var(--panel-line);
        border-radius: 6px;
        background:
          linear-gradient(rgba(255, 251, 236, 0.74), rgba(238, 225, 199, 0.68)),
          var(--paper);
        box-shadow:
          inset 0 0 0 4px rgba(255, 252, 238, 0.34),
          0 16px 34px rgba(70, 53, 34, 0.16);
        opacity: 0;
        visibility: hidden;
        transform: translateY(18px) scale(0.97);
        transform-origin: 78% 45%;
        pointer-events: none;
        transition:
          opacity 360ms ease,
          transform 460ms cubic-bezier(0.2, 0.74, 0.26, 1),
          visibility 0s linear 460ms;
      }

      .classic-card::after {
        content: "";
        position: absolute;
        inset: 7px;
        border: 1px solid rgba(112, 86, 53, 0.18);
        pointer-events: none;
      }

      .classic-card.is-visible {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
        pointer-events: auto;
        transition-delay: 0s;
      }

      .classic-card h2 {
        margin: 0 0 9px;
        padding-right: 30px;
        font-size: 21px;
      }

      .classic-card p {
        margin: 0;
        color: #53483c;
        line-height: 1.75;
        font-size: 14px;
      }

      .classic-source {
        display: inline-block;
        margin-top: 12px;
        padding: 4px 10px;
        color: #704739;
        border: 1px solid rgba(139, 76, 54, 0.28);
        background: rgba(238, 220, 189, 0.54);
        font-size: 13px;
      }

      .classic-close {
        position: absolute;
        z-index: 2;
        top: 11px;
        right: 12px;
        width: 30px;
        height: 30px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        color: #5b5042;
        background: rgba(194, 177, 145, 0.35);
        font-size: 24px;
        line-height: 28px;
        cursor: pointer;
      }

      .timeline {
        position: absolute;
        z-index: 16;
        left: calc(23.5% + 18px);
        right: 18px;
        bottom: 1.8%;
        height: 14.5%;
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: 7px;
      }

      .timeline::before {
        content: "";
        position: absolute;
        left: 1%;
        right: 1%;
        bottom: 5px;
        height: 3px;
        background: linear-gradient(90deg, rgba(88, 71, 47, 0.46), rgba(88, 71, 47, 0.16), rgba(88, 71, 47, 0.46));
      }

      .era-btn {
        position: relative;
        display: grid;
        place-items: center;
        padding: 8px 4px 16px;
        border: 1px solid var(--panel-line);
        border-radius: 6px;
        color: var(--ink);
        background:
          linear-gradient(rgba(255, 251, 237, 0.92), rgba(233, 219, 191, 0.84)),
          var(--paper);
        cursor: pointer;
        text-align: center;
        box-shadow:
          inset 0 0 0 3px rgba(255, 252, 238, 0.32),
          0 9px 18px rgba(70, 53, 34, 0.08);
        transition: transform 220ms ease, box-shadow 220ms ease, border-color 220ms ease;
      }

      .era-btn::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -13px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #7a674e;
        transform: translateX(-50%);
        border: 2px solid rgba(239, 228, 203, 0.9);
      }

      .era-btn b {
        display: block;
        font-size: clamp(11px, 0.85vw, 15px);
        line-height: 1.35;
        font-weight: 600;
      }

      .era-btn small {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: clamp(10px, 0.72vw, 12px);
        line-height: 1.35;
      }

      .era-btn.active {
        transform: translateY(-4px);
        border-color: rgba(83, 142, 168, 0.75);
        box-shadow:
          inset 0 0 0 3px rgba(255, 252, 238, 0.45),
          0 0 0 3px rgba(108, 159, 181, 0.26),
          0 16px 26px rgba(63, 87, 94, 0.15);
      }

      .era-btn.active::after {
        background: var(--river);
        box-shadow: 0 0 0 5px rgba(94, 153, 173, 0.22);
      }

      .era-btn.has-classic::before {
        content: "注";
        position: absolute;
        top: 4px;
        right: 4px;
        color: rgba(139, 57, 41, 0.58);
        font-size: 10px;
      }

      .place-label {
        color: #29231b;
        font-size: 16px;
        font-weight: 700;
        text-shadow:
          0 1px 0 rgba(255, 250, 232, 0.8),
          0 0 8px rgba(255, 250, 232, 0.88);
        white-space: nowrap;
      }

      .place-dot {
        width: 17px;
        height: 17px;
        border-radius: 50%;
        border: 3px solid rgba(159, 63, 45, 0.72);
        background: #fff6e3;
        box-shadow: 0 0 0 3px rgba(255, 245, 224, 0.58);
      }

      .mountain-label {
        color: #5d685e;
        font-size: 13px;
        font-weight: 700;
        text-shadow: 0 1px 0 rgba(255, 250, 232, 0.8);
      }

      .mountain-label::before {
        content: "山";
        display: block;
        color: rgba(83, 102, 88, 0.72);
        font-size: 22px;
        line-height: 0.9;
        text-align: center;
      }

      .mountain-art {
        pointer-events: none;
        opacity: 0.58;
        mix-blend-mode: multiply;
        filter: sepia(0.35) saturate(0.46) brightness(1.12) contrast(0.88);
        transition: opacity 180ms ease;
      }

      .mountain-art img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      .traveller-icon {
        filter: drop-shadow(0 9px 7px rgba(59, 44, 29, 0.25));
        transition: transform 360ms ease;
      }

      @media (max-width: 1100px) {
        .side-panel,
        .classic-card {
          display: none;
        }

        .masthead {
          left: 5%;
          right: 5%;
        }

        .story-card {
          left: 4%;
          right: 4%;
          top: auto;
          bottom: 18%;
          width: auto;
          min-width: 0;
        }

        .timeline {
          left: 12px;
          right: 12px;
          bottom: 12px;
          height: 128px;
          grid-template-columns: repeat(12, 92px);
          overflow-x: auto;
          overflow-y: hidden;
        }

        .timeline::before {
          display: none;
        }

        .map-shell {
          left: 0;
          bottom: 150px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
     

      <section class="map-shell" aria-label="GIS 数据驱动的郦道元行旅地图">
        <div id="map"></div>
      </section>

      <span class="art-layer left-mountain" aria-hidden="true"></span>
      <span class="art-layer right-mountain" aria-hidden="true"></span>
      <span class="art-layer boat" aria-hidden="true"></span>

      <aside class="side-panel" aria-label="地图说明">
        <article class="story-card" id="storyCard" data-tag="少年研学">
          <div class="story-ribbon">当前故事</div>
          <h2 id="storyTitle">延兴二年（472年）　范阳涿州</h2>
          <p id="storyText">郦道元出生于北魏官宦世家。故乡河渠纵横、北接山地，为他日后观察山川形势埋下最初的种子。</p>
          <div class="story-figure">
            <img id="storyImage" src="./Data/封面底图2.png" alt="" />
          </div>
          <div class="story-meta" id="storyMeta">
            <span>范阳涿州</span><span>启程</span>
          </div>
        </article>
        <div class="side-route-figure" aria-label="郦道元行旅路径与地图图例">
          <img src="./Data/行旅路径小图和图例.png" alt="郦道元行旅路径缩略图与图例" />
        </div>
        <div class="legend">
          <label class="layer-toggle" for="mountainToggle">
            <span>显示山体贴图</span>
            <input id="mountainToggle" type="checkbox" checked />
            <span class="toggle-track" aria-hidden="true"></span>
          </label>
        </div>
      </aside>

      <article class="classic-card" id="classicCard" aria-hidden="true" aria-live="polite">
        <button class="classic-close" id="classicClose" type="button" aria-label="关闭《水经注》彩蛋">×</button>
        <h2 id="classicTitle">《水经注》山水札记</h2>
        <p id="classicText"></p>
        <span class="classic-source" id="classicSource"></span>
      </article>

      <nav class="timeline" id="timeline" aria-label="郦道元行旅时间轴"></nav>
    </main>

    <script src="./vendor/leaflet/leaflet.js"></script>
    <script src="./Data/geojson-bundle.js"></script>
    <script>
      const dataRoot = "./Data/geojson";

      const stages = [

      let traveller;

      function readBundledGeoJson(path) {
        const key = path.replace(`${dataRoot}/`, "");
        const bundledData = window.LDY_GEOJSON_BUNDLE && window.LDY_GEOJSON_BUNDLE[key];
        if (!bundledData) throw new Error(`Missing bundled GeoJSON: ${key}`);
        return typeof structuredClone === "function" ? structuredClone(bundledData) : JSON.parse(JSON.stringify(bundledData));
      }

      async function loadGeoJson(path) {
        if (window.location.protocol === "file:") {
          return readBundledGeoJson(path);
        }

        try {
          const response = await fetch(path);
          if (!response.ok) throw new Error(`${response.status} ${path}`);
          return response.json();
        } catch (error) {
          console.warn(`Fetch GeoJSON failed, use bundled data instead: ${path}`, error);
          return readBundledGeoJson(path);
        }
      }

      function makePlaceMarker(latlng, label, active = false) {
        const marker = L.marker(latlng, {
          pane: "points",
          icon: L.divIcon({
            className: "",
            html: `<span class="place-dot"></span>`,
            iconSize: [18, 18],
            iconAnchor: [9, 9],
          }),
        });
        if (!active) return marker;

        const text = L.marker(latlng, {
          pane: "points",
          icon: L.divIcon({
            className: "place-label",
            html: label,
            iconSize: [70, 24],
            iconAnchor: active ? [-14, 30] : [-12, 18],
          }),
        });
        return L.layerGroup([marker, text]);
      }

      function makeTraveller(latlng) {
        return L.marker(latlng, {
          pane: "points",
          icon: L.icon({
              iconUrl: "./Data/Q版小人站立.png",
            iconSize: [70, 88],
            iconAnchor: [30, 58],
            className: "traveller-icon",
          }),
          interactive: false,
        }).addTo(map);
      }

      function makeMountainArtMarker(latlng, name) {
        const art = mountainArt[name];
        if (!art) return null;

        return L.marker(latlng, {
          pane: "mountainArt",
          icon: L.divIcon({
            className: "mountain-art",
            html: `<img src="${art.src}" alt="" />`,
            iconSize: art.size,
            iconAnchor: art.anchor,
          }),
          interactive: false,
        });
      }

      function getFeatureLatLng(feature) {
        const coords = feature.geometry.coordinates;
        if (feature.geometry.type === "Point") return [coords[1], coords[0]];
        return null;
      }

      async function drawBaseLayers() {
        const china = await loadGeoJson(`${dataRoot}/china/ChinaBoundpoly.geojson`);
        const chinaLayer = L.geoJSON(china, {
          pane: "land",
          style: inkLandStyle,
          interactive: false,
        }).addTo(map);

        map.fitBounds(chinaLayer.getBounds().pad(0), {
          animate: false,
          paddingTopLeft: [0, 200],//[左侧留白, 顶部留白]
          paddingBottomRight: [0, 10],//[右侧留白, 底部留白]
        });
        const lockedZoom = map.getZoom();
        map.setMinZoom(lockedZoom);
        map.setMaxZoom(lockedZoom);

        await Promise.all(
          rivers.map(async (name) => {
            const data = await loadGeoJson(`${dataRoot}/rivers/${name}.geojson`);
            L.geoJSON(data, {
              pane: "rivers",
              style: name === "Taihu" || name.includes("poly") ? lakeStyle : riverStyle,
              interactive: false,
            }).addTo(map);
          }),
        );

        await Promise.all(
          mountains.map(async (name) => {
            const data = await loadGeoJson(`${dataRoot}/mountains/${name}.geojson`);
            const feature = data.features[0];
            const latlng = feature ? getFeatureLatLng(feature) : null;
            if (!latlng) return;
            const artMarker = makeMountainArtMarker(latlng, name);
            if (artMarker) artMarker.addTo(mountainArtLayer);
            L.marker(latlng, {
              pane: "points",
              icon: L.divIcon({
                className: "mountain-label",
                html: mountainNames[name] || name,
                iconSize: [70, 42],
                iconAnchor: [35, 20],
              }),
              interactive: false,
            }).addTo(map);
          }),
        );
      }

      function bindLayerToggles() {
        const mountainToggle = document.getElementById("mountainToggle");
        if (!mountainToggle) return;

        mountainToggle.addEventListener("change", () => {
          if (mountainToggle.checked) {
            mountainArtLayer.addTo(map);
          } else {
            mountainArtLayer.remove();
          }
        });
      }

      async function drawAllPlaces() {
        await Promise.all(
          Object.keys(placeNames).map(async (name) => {
            const data = await loadGeoJson(`${dataRoot}/places/${name}.geojson`);
            const latlng = getFeatureLatLng(data.features[0]);
            if (!latlng) return;
            makePlaceMarker(latlng, placeNames[name]).addTo(map);
          }),
        );
      }

      function drawCompletedRoutes(index) {
        completedRouteLayer.clearLayers();
        for (let i = 0; i < index; i += 1) {
          L.polyline(stages[i].route, {
            pane: "route",
            color: "rgba(137, 61, 43, 0.42)",
            weight: 2.7,
            dashArray: "6 8",
            lineCap: "round",
            lineJoin: "round",
          }).addTo(completedRouteLayer);
        }
      }

      async function activateStage(index) {
        const stage = stages[index];
        routeLayer.clearLayers();
        activePlaceLayer.clearLayers();
        hideClassicCard();

        drawCompletedRoutes(index);

        L.polyline(stage.route, {
          pane: "route",
          color: "#934532",
          weight: 3.2,
          dashArray: "7 8",
          lineCap: "round",
          lineJoin: "round",
        }).addTo(routeLayer);

        stage.placeIds.forEach(async (name) => {
          const data = await loadGeoJson(`${dataRoot}/places/${name}.geojson`);
          const latlng = getFeatureLatLng(data.features[0]);
          if (!latlng) return;
          makePlaceMarker(latlng, placeNames[name] || name, true).addTo(activePlaceLayer);
        });

        document.getElementById("storyCard").dataset.tag = stage.era;
        document.getElementById("storyTitle").textContent = stage.storyHeading;
        document.getElementById("storyText").textContent = stage.story;
        document.getElementById("storyImage").src = stage.scene || stage.icon;
        document.getElementById("storyMeta").innerHTML = stage.tags.map((tag) => `<span>${tag}</span>`).join("");
        document.querySelectorAll(".era-btn").forEach((btn, btnIndex) => {
          btn.classList.toggle("active", btnIndex === index);
        });

        if (!traveller) {
          traveller = makeTraveller(stage.route[stage.focusIndex ?? stage.route.length - 1]);
        } else {
          await animateTraveller(stage.route.slice(0, (stage.focusIndex ?? stage.route.length - 1) + 1));
        }

        const currentButton = document.querySelector(".era-btn.active");
        if (!currentButton || Number(currentButton.dataset.index) !== index) return;

        if (stage.classic) showClassicCard(stage.classic);
      }

      function animateTraveller(route) {
        cancelAnimationFrame(travellerFrame);
        const steps = [];
        for (let i = 0; i < route.length - 1; i += 1) {
          const start = route[i];
          const end = route[i + 1];
          for (let j = 0; j < 28; j += 1) {
            const t = j / 28;
            steps.push([start[0] + (end[0] - start[0]) * t, start[1] + (end[1] - start[1]) * t]);
          }
        }
        steps.push(route[route.length - 1]);

        return new Promise((resolve) => {
          let frame = 0;
          const tick = () => {
            traveller.setLatLng(steps[frame]);
            frame += 1;
            if (frame < steps.length) {
              travellerFrame = requestAnimationFrame(tick);
            } else {
              resolve();
            }
          };
          tick();
        });
      }

      function hideClassicCard() {
        const card = document.getElementById("classicCard");
        card.classList.remove("is-visible");
        card.setAttribute("aria-hidden", "true");
      }

      function showClassicCard(classic) {
        document.getElementById("classicTitle").textContent = classic.title;
        document.getElementById("classicText").textContent = classic.text;
        document.getElementById("classicSource").textContent = classic.source;
        const card = document.getElementById("classicCard");
        card.classList.add("is-visible");
        card.setAttribute("aria-hidden", "false");
      }

      function renderTimeline() {
        const timeline = document.getElementById("timeline");
        timeline.innerHTML = stages
          .map(
            (stage, index) => `
              <button class="era-btn ${index === 0 ? "active" : ""} ${stage.classic ? "has-classic" : ""}" type="button" data-index="${index}">
                <span>
                  <b>${stage.era}</b>
                  <small>（${stage.year}）</small>
                </span>
              </button>
            `,
          )
          .join("");
        timeline.querySelectorAll(".era-btn").forEach((button) => {
          button.addEventListener("click", () => activateStage(Number(button.dataset.index)));
        });
      }

      async function init() {
        renderTimeline();
        bindLayerToggles();
        document.getElementById("classicClose").addEventListener("click", hideClassicCard);
        await drawBaseLayers();
        await drawAllPlaces();
        traveller = makeTraveller(stages[0].route[stages[0].focusIndex ?? stages[0].route.length - 1]);
        activateStage(0);
      }

      init().catch((error) => {
        console.error(error);
        document.getElementById("storyText").textContent = "地图数据加载失败，请检查 GeoJSON 文件路径或本地服务器。";
      });
    </script>
  </body>
</html>
