<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>郦道元行旅中国｜GIS 水墨历史地图</title>
    <link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
    <style>
      :root {
        --paper: #efe8d5;
        --paper-deep: #d4c19c;
        --ink: #25211b;
        --muted: #695f50;
        --river: #4f91a6;
        --route: #9b4b35;
        --seal: #9d3429;
        --panel-line: rgba(96, 75, 48, 0.26);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        color: var(--ink);
        background: #bca987;
        font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
      }

      button {
        font: inherit;
      }

      .page {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(circle at 56% 24%, rgba(255, 252, 239, 0.9), transparent 34%),
          radial-gradient(circle at 72% 58%, rgba(92, 145, 157, 0.17), transparent 28%),
          linear-gradient(90deg, rgba(74, 56, 34, 0.24), transparent 12%, transparent 88%, rgba(74, 56, 34, 0.18)),
          var(--paper);
      }

      .page::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        background:
          linear-gradient(90deg, rgba(58, 43, 27, 0.12), transparent 9%, transparent 92%, rgba(58, 43, 27, 0.1)),
          radial-gradient(circle at 30% 38%, rgba(72, 91, 77, 0.08), transparent 24%),
          radial-gradient(circle at 86% 24%, rgba(71, 93, 87, 0.13), transparent 21%);
        mix-blend-mode: multiply;
      }

      .page::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 20;
        pointer-events: none;
        box-shadow:
          inset 0 0 70px rgba(76, 57, 33, 0.2),
          inset 0 0 0 1px rgba(101, 78, 48, 0.22);
      }

      .masthead {
        position: absolute;
        z-index: 12;
        left: 18%;
        right: 18%;
        top: 2.4%;
        text-align: center;
        pointer-events: none;
      }

      .masthead h1 {
        margin: 0;
        font-family: "STXingkai", "KaiTi", "Kaiti SC", serif;
        font-size: clamp(42px, 6vw, 96px);
        line-height: 1;
        letter-spacing: 0;
        text-shadow: 0 5px 12px rgba(65, 47, 26, 0.14);
      }

      .masthead p {
        margin: 12px 0 0;
        color: #40372e;
        font-size: clamp(14px, 1.5vw, 24px);
      }

      .map-shell {
        position: absolute;
        left: 18%;
        right: 0;
        top: 0;
        bottom: 16.5%;
        z-index: 1;
        overflow: hidden;
        border-left: 1px solid rgba(92, 72, 46, 0.24);
      }

      /* 宣纸纹理覆盖整个地图区域，透明叠加，不拦截地图上的标注和按钮。 */
      .map-shell::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 8;
        opacity: 0.9;
        background-image: url("./Data/宣纸样式.png");
        background-repeat: repeat;
        background-size: 720px auto;
        mix-blend-mode: multiply;
      }

      #map {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
        background: transparent;
        filter: saturate(0.72) contrast(0.9) sepia(0.18);
      }

      .leaflet-container {
        background: transparent;
        font-family: inherit;
      }

      /* 海面位于地图右下方，并通过左侧渐隐与陆地区域自然衔接。 */
      .sea-surface {
        position: absolute;
        z-index: 0;
        right: 0%;
        bottom: 0%;
        width: 56%;
        height: 200%;
        object-fit: cover;
        opacity: 0.7;
        filter: saturate(0.7) sepia(0.12) brightness(1.08);
        mix-blend-mode: multiply;
        pointer-events: none;
        -webkit-mask-image: radial-gradient(ellipse 92% 92% at 100% 100%, #000 0 48%, rgba(0, 0, 0, 0.72) 62%, transparent 100%);
        mask-image: radial-gradient(ellipse 92% 92% at 100% 100%, #000 0 48%, rgba(0, 0, 0, 0.72) 62%, transparent 100%);
      }

      .leaflet-control-attribution {
        display: none;
      }

      .leaflet-pane.leaflet-marker-pane,
      .leaflet-pane.leaflet-overlay-pane {
        mix-blend-mode: multiply;
      }

      .art-layer {
        position: absolute;
        z-index: 6;
        pointer-events: none;
        background-repeat: no-repeat;
        background-size: contain;
        opacity: 0.38;
        mix-blend-mode: multiply;
        filter: sepia(0.28) saturate(0.5) brightness(1.12);
      }

      .side-panel {
        position: absolute;
        z-index: 14;
        display: flex;
        flex-direction: column;
        gap: 10px;
        top: 0;
        bottom: 0;
        left: 0;
        width: 18%;
        min-width: 320px;
        padding: 2.2vh 18px 18px;
        background:
          linear-gradient(90deg, rgba(223, 209, 179, 0.72), rgba(246, 237, 215, 0.58) 72%, rgba(246, 237, 215, 0.18) 94%, transparent),
          radial-gradient(circle at 45% 4%, rgba(98, 115, 92, 0.18), transparent 18%),
          radial-gradient(circle at 48% 94%, rgba(83, 106, 87, 0.2), transparent 20%),
          var(--paper);
        box-shadow:
          inset -28px 0 36px rgba(88, 69, 44, 0.05),
          18px 0 42px rgba(228, 214, 184, 0.2);
        -webkit-mask-image: linear-gradient(90deg, #000 0 86%, rgba(0, 0, 0, 0.68) 94%, transparent 100%);
        mask-image: linear-gradient(90deg, #000 0 86%, rgba(0, 0, 0, 0.68) 94%, transparent 100%);
      }

      /* 地图边角山水位于行政底图上方、河流和标注下方，作为画卷景深而非 UI 背景。 */
      .map-corner-art {
        mix-blend-mode: multiply;
        pointer-events: none;
        filter: sepia(0.18) saturate(0.48) brightness(1.14) contrast(0.88);
      }

      .mountain-fade-overlay {
        mix-blend-mode: multiply;
        pointer-events: none;
        filter: sepia(0.18) saturate(0.7) brightness(1.08) contrast(0.9);
        -webkit-mask-image: radial-gradient(ellipse 88% 88% at center, #000 0 48%, rgba(0, 0, 0, 0.58) 68%, transparent 100%);
        mask-image: radial-gradient(ellipse 88% 88% at center, #000 0 48%, rgba(0, 0, 0, 0.58) 68%, transparent 100%);
      }

      .map-corner-art-top {
        -webkit-mask-image: radial-gradient(ellipse 72% 82% at 0 0, #000 0 32%, rgba(0, 0, 0, 0.62) 56%, transparent 100%);
        mask-image: radial-gradient(ellipse 72% 82% at 0 0, #000 0 32%, rgba(0, 0, 0, 0.62) 56%, transparent 100%);
      }

      .map-corner-art-bottom {
        -webkit-mask-image: radial-gradient(ellipse 72% 82% at 0 100%, #000 0 32%, rgba(0, 0, 0, 0.6) 56%, transparent 100%);
        mask-image: radial-gradient(ellipse 72% 82% at 0 100%, #000 0 32%, rgba(0, 0, 0, 0.6) 56%, transparent 100%);
      }

      /* 城郭和楼阁作为文化地标贴图，白色宣纸背景通过正片叠底自然融入地图。 */
      .building-art {
        pointer-events: none;
        opacity: 0.72;
        mix-blend-mode: multiply;
        filter: sepia(0.28) saturate(0.62) brightness(1.06) contrast(0.94);
      }

      .building-art img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .side-panel h2,
      .legend h3 {
        margin: 0;
        font-size: 18px;
        line-height: 1.25;
        text-align: center;
      }

      .author-profile {
        position: relative;
        z-index: 3;
        display: grid;
        grid-template-columns: 112px minmax(0, 1fr);
        align-items: center;
        min-height: 124px;
        padding: 8px 10px 8px 0;
        overflow: hidden;
        border-bottom: 1px solid rgba(103, 82, 54, 0.08);
        background:
          radial-gradient(ellipse at 18% 58%, rgba(120, 96, 61, 0.1), transparent 55%),
          linear-gradient(90deg, rgba(248, 241, 220, 0.04), rgba(248, 241, 220, 0.18), transparent);
      }

      .author-profile::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent 0 66%, rgba(246, 237, 215, 0.24) 100%);
        pointer-events: none;
      }

      .author-portrait {
        position: relative;
        z-index: 1;
        align-self: end;
        width: 124px;
        height: 128px;
        margin-left: -19px;
        margin-bottom: -8px;
        object-fit: cover;
        object-position: 25% 18%;
        opacity: 0.86;
        mix-blend-mode: multiply;
        filter: sepia(0.22) saturate(0.62) brightness(1.08) contrast(0.88);
        -webkit-mask-image: radial-gradient(ellipse 74% 82% at 45% 52%, #000 0 42%, rgba(0, 0, 0, 0.48) 66%, transparent 100%);
        mask-image: radial-gradient(ellipse 74% 82% at 45% 52%, #000 0 42%, rgba(0, 0, 0, 0.48) 66%, transparent 100%);
      }

      .author-copy {
        position: relative;
        z-index: 1;
        min-width: 0;
        padding: 3px 0 0 6px;
        color: #433729;
        font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", SimSun, serif;
      }

      .author-copy strong {
        display: block;
        margin-bottom: 7px;
        color: #2f291f;
        font-family: "Ma Shan Zheng", KaiTi, STKaiti, serif;
        font-size: 27px;
        font-weight: 700;
        line-height: 1.08;
        letter-spacing: 0;
      }

      .author-copy span {
        display: block;
        margin-bottom: 8px;
        color: #5e5245;
        font-size: 15px;
        line-height: 1.2;
      }

      .author-copy p {
        margin: 0;
        color: #4f463a;
        font-size: 14px;
        line-height: 1.7;
      }

      .mini-map {
        position: relative;
        flex: 1 1 auto;
        min-height: 250px;
        margin: 12px 0 0;
        border: 1px solid var(--panel-line);
        border-radius: 4px;
        background:
          radial-gradient(circle at 64% 58%, rgba(151, 84, 55, 0.12), transparent 18%),
          linear-gradient(135deg, rgba(255, 250, 235, 0.7), rgba(216, 199, 166, 0.58));
        overflow: hidden;
        box-shadow: inset 0 0 18px rgba(77, 58, 34, 0.08);
      }

      .mini-map svg {
        width: 100%;
        height: 100%;
      }

      .route-overview {
        position: relative;
        z-index: 2;
        flex: 1 1 auto;
        min-height: 0;
        margin-top: 0;
        padding: 12px 14px 10px;
        overflow: hidden;
        border: 1px solid rgba(103, 82, 54, 0.1);
        background:
          linear-gradient(rgba(251, 246, 230, 0.44), rgba(231, 217, 191, 0.28)),
          var(--paper);
        box-shadow: inset 0 0 18px rgba(78, 58, 34, 0.045);
      }

      .route-overview::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        background-image: url("./Data/宣纸样式.png");
        background-repeat: repeat;
        background-size: 620px auto;
        opacity: 0.5;
        mix-blend-mode: multiply;
        pointer-events: none;
      }

      .route-overview h3 {
        position: relative;
        z-index: 1;
        margin: 0 0 7px;
        color: #40372d;
        font-size: 16px;
        text-align: center;
        font-weight: 700;
      }

      .route-mini-map {
        position: relative;
        z-index: 1;
        width: 100%;
        height: clamp(220px, 25vh, 280px);
        display: block;
        border-bottom: 1px solid rgba(103, 82, 54, 0.16);
      }

      .mini-map-image {
        opacity: 0.8;
        mix-blend-mode: multiply;
        filter: sepia(0.12) saturate(0.74) brightness(1.04) contrast(0.92);
      }

      .mini-land {
        display: none;
      }

      .mini-route-line {
        fill: none;
        stroke: #9b4b35;
        stroke-width: 1.4;
        stroke-dasharray: 4 5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .mini-route-node {
        fill: #f8edd7;
        stroke: #9b4b35;
        stroke-width: 1.7;
        transition: r 180ms ease, fill 180ms ease, stroke 180ms ease;
      }

      .mini-route-node.visited {
        fill: #b46a52;
      }

      .mini-route-node.active {
        r: 5.5;
        fill: #4f91a6;
        stroke: #f7edda;
        stroke-width: 2.6;
      }

      .legend {
        position: relative;
        z-index: 2;
        flex: 0 0 auto;
      }

      .legend ul {
        list-style: none;
        margin: 9px 0 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 7px 12px;
        color: var(--muted);
        font-size: 12px;
      }

      .legend li {
        display: grid;
        grid-template-columns: 25px 1fr;
        align-items: center;
        gap: 9px;
      }

      .legend-symbol {
        display: block;
        width: 24px;
        height: 15px;
        position: relative;
      }

      .legend-symbol.route {
        border-top: 2px dashed var(--route);
      }

      .legend-symbol.current::before {
        content: "";
        position: absolute;
        left: 7px;
        top: 1px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        border: 2px solid #f7edda;
        background: var(--river);
        box-shadow: 0 0 0 1px rgba(69, 111, 122, 0.45);
      }

      .legend-symbol.river {
        border-top: 3px solid var(--river);
        border-radius: 999px;
      }

      .legend-symbol.city::before {
        content: "";
        position: absolute;
        left: 7px;
        top: 1px;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        border: 3px solid rgba(156, 59, 42, 0.72);
        background: #fff8e8;
      }

      .legend-symbol.mountain::before {
        content: "▲";
        position: absolute;
        inset: -5px 0 0;
        color: #687264;
        font-size: 18px;
        text-align: center;
      }

      .layer-toggle {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 10px;
        padding: 10px 12px;
        border: 1px solid rgba(104, 82, 53, 0.18);
        border-radius: 999px;
        color: #4f4639;
        background: rgba(248, 240, 220, 0.68);
        font-size: 14px;
        cursor: pointer;
        user-select: none;
      }

      .layer-toggle input {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        opacity: 0;
        pointer-events: none;
      }

      .toggle-track {
        position: relative;
        width: 44px;
        height: 24px;
        flex: 0 0 auto;
        border: 1px solid rgba(104, 82, 53, 0.28);
        border-radius: 999px;
        background: rgba(174, 157, 126, 0.35);
        transition: background 180ms ease, border-color 180ms ease;
      }

      .toggle-track::after {
        content: "";
        position: absolute;
        left: 3px;
        top: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #f7eed9;
        box-shadow: 0 1px 4px rgba(76, 57, 33, 0.22);
        transition: transform 180ms ease;
      }

      .layer-toggle input:checked + .toggle-track {
        border-color: rgba(65, 132, 151, 0.52);
        background: rgba(82, 143, 161, 0.58);
      }

      .layer-toggle input:checked + .toggle-track::after {
        transform: translateX(20px);
      }

      /* 山水贴图显示方式采用三段式按钮，默认同时显示山体与水体。 */
      .layer-modes {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 5px;
        margin-top: 10px;
        padding: 4px;
        border: 1px solid rgba(104, 82, 53, 0.2);
        background: rgba(244, 235, 214, 0.72);
      }

      .layer-mode-btn {
        min-width: 0;
        padding: 8px 3px;
        border: 1px solid transparent;
        color: #5b5042;
        background: transparent;
        font-size: 12px;
        line-height: 1.2;
        cursor: pointer;
        transition: background 180ms ease, border-color 180ms ease, color 180ms ease;
      }

      .layer-mode-btn.active {
        color: #274e58;
        border-color: rgba(71, 124, 140, 0.38);
        background: rgba(204, 224, 222, 0.72);
        box-shadow: inset 0 0 0 1px rgba(255, 252, 238, 0.62);
      }

      .story-card {
        position: absolute;
        z-index: 18;
        top: 11%;
        right: 1.4%;
        display: grid;
        grid-template-columns: 58px minmax(0, 1fr);
        grid-template-rows: auto auto auto auto;
        column-gap: 12px;
        width: min(24vw, 390px);
        min-width: 318px;
        min-height: 0;
        margin: 0;
        padding: 16px 14px 18px 12px;
        border: 1px solid rgba(103, 78, 48, 0.34);
        border-radius: 6px;
        background:
          linear-gradient(90deg, rgba(224, 207, 176, 0.64), rgba(255, 252, 239, 0.9) 18%, rgba(236, 221, 195, 0.76)),
          var(--paper);
        box-shadow:
          inset 0 0 0 4px rgba(255, 252, 238, 0.42),
          inset 0 0 24px rgba(82, 58, 31, 0.13),
          0 16px 34px rgba(65, 50, 33, 0.16);
      }

      .story-card::after {
        content: "";
        position: absolute;
        inset: 7px;
        border: 1px solid rgba(105, 82, 52, 0.16);
        border-radius: 0;
        pointer-events: none;
      }

      .story-ribbon {
        position: absolute;
        top: 17px;
        left: 23px;
        z-index: 2;
        display: grid;
        place-items: center;
        width: 22px;
        height: 22px;
        color: #b3432f;
        border: 1px solid rgba(163, 63, 47, 0.58);
        background: rgba(255, 246, 224, 0.72);
        font-family: KaiTi, STKaiti, "Ma Shan Zheng", serif;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .story-ribbon::before,
      .story-ribbon::after {
        content: none;
      }

      .story-card h2 {
        grid-column: 1;
        grid-row: 1 / 5;
        align-self: stretch;
        justify-self: center;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        margin: 0;
        padding: 15px 0 10px;
        border: 1px solid rgba(112, 86, 53, 0.22);
        background: rgba(255, 250, 235, 0.42);
        color: #342a20;
        font-family: "Ma Shan Zheng", KaiTi, STKaiti, serif;
        font-size: 22px;
        font-weight: 700;
        line-height: 1.45;
        letter-spacing: 0;
        text-align: center;
        writing-mode: vertical-rl;
      }

      .story-dateline {
        grid-column: 2;
        display: flex;
        align-items: baseline;
        justify-content: flex-start;
        gap: 4px;
        margin: 2px 0 8px;
        color: #493b2e;
        font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", SimSun, serif;
        font-size: 15px;
        font-weight: 700;
        white-space: nowrap;
      }

      .story-year {
        color: #7a6754;
        font-size: 10px;
        font-weight: 400;
      }

      .story-dateline i {
        width: 1px;
        height: 13px;
        background: rgba(114, 83, 50, 0.36);
      }

      .story-card p {
        grid-column: 2;
        margin: 0;
        color: #4c4338;
        font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", SimSun, serif;
        font-size: 14px;
        line-height: 1.85;
        max-width: none;
        text-align: justify;
      }

      .story-meta {
        grid-column: 2;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
        padding-top: 0;
        border-top: 0;
      }

      .story-meta span {
        padding: 4px 12px;
        border: 1px solid rgba(105, 82, 52, 0.26);
        border-radius: 999px;
        color: #76624d;
        background: rgba(225, 208, 180, 0.45);
        font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", SimSun, serif;
        font-size: 12px;
      }

      .story-figure {
        grid-column: 2;
        position: relative;
        aspect-ratio: 16 / 9;
        height: auto;
        margin-top: 12px;
        overflow: visible;
        background: rgba(228, 216, 190, 0.38);
      }

      .story-figure::after {
        content: none;
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 50%, rgba(239, 228, 204, 0.4) 78%, rgba(239, 228, 204, 0.88) 100%);
        pointer-events: none;
      }

      .story-figure img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
        display: block;
        opacity: 0.88;
        filter: grayscale(0.3) sepia(0.2) saturate(0.72) brightness(1.08) contrast(0.92);
        mix-blend-mode: multiply;
        -webkit-mask-image: none;
        mask-image: none;
      }

      .classic-card {
        position: relative;
        z-index: 18;
        display: grid;
        grid-template-columns: 46px minmax(0, 1fr);
        column-gap: 12px;
        width: 100%;
        min-width: 0;
        max-height: 0;
        padding: 0 16px 0 10px;
        border: 1px solid var(--panel-line);
        border-width: 0;
        border-radius: 6px;
        background:
          linear-gradient(90deg, rgba(222, 205, 174, 0.72), rgba(255, 251, 236, 0.84) 20%, rgba(238, 225, 199, 0.68)),
          var(--paper);
        box-shadow:
          inset 0 0 0 4px rgba(255, 252, 238, 0.34),
          0 16px 34px rgba(70, 53, 34, 0.16);
        opacity: 0;
        visibility: hidden;
        overflow: hidden;
        transform: translateY(18px) scale(0.97);
        transform-origin: 18% 45%;
        pointer-events: none;
        transition:
          max-height 460ms cubic-bezier(0.2, 0.74, 0.26, 1),
          padding 460ms cubic-bezier(0.2, 0.74, 0.26, 1),
          border-width 460ms cubic-bezier(0.2, 0.74, 0.26, 1),
          opacity 360ms ease,

        const key = path.replace(`${dataRoot}/`, "");
        const bundledData = window.LDY_GEOJSON_BUNDLE && window.LDY_GEOJSON_BUNDLE[key];
        if (!bundledData) throw new Error(`Missing bundled GeoJSON: ${key}`);
        return typeof structuredClone === "function" ? structuredClone(bundledData) : JSON.parse(JSON.stringify(bundledData));
      }

      async function loadGeoJson(path) {
        if (window.location.protocol === "file:") {

        try {
          const response = await fetch(path);
          if (!response.ok) throw new Error(`${response.status} ${path}`);
          return response.json();
        } catch (error) {
          console.warn(`Fetch GeoJSON failed, use bundled data instead: ${path}`, error);
          return readBundledGeoJson(path);
        }
      }

      function getFeatureLatLng(feature) {
        const coords = feature.geometry.coordinates;
        if (feature.geometry.type === "Point") return [coords[1], coords[0]];
        return null;
      }

      function getAlignedWaterBounds(geoBounds, artSource) {
        const fileName = decodeURIComponent(artSource.split("/").pop());
        const crop = waterArtCrop[fileName] || [0, 0, 1, 1];
        const [left, top, right, bottom] = crop;
        const contentWidth = Math.max(right - left, 0.01);
        const contentHeight = Math.max(bottom - top, 0.01);

        const geoWidth = geoBounds.getEast() - geoBounds.getWest();
        const geoHeight = geoBounds.getNorth() - geoBounds.getSouth();
        const fullWidth = geoWidth / contentWidth;
        const fullHeight = geoHeight / contentHeight;

        const west = geoBounds.getWest() - left * fullWidth;
        const east = west + fullWidth;
        const north = geoBounds.getNorth() + top * fullHeight;
        const south = north - fullHeight;
        return L.latLngBounds([south, west], [north, east]);
      }

      function getMiniMapProjector() {
        const plot = { left: 28, right: 222, top: 18, bottom: 168 };
        const bounds = { west: 73, east: 135, south: 18, north: 54 };

        return ([lng, lat]) => [
          plot.left + ((lng - bounds.west) / (bounds.east - bounds.west)) * (plot.right - plot.left),
          plot.top + ((bounds.north - lat) / (bounds.north - bounds.south)) * (plot.bottom - plot.top),
        ];
      }

      function geometryToMiniPaths(geometry, project) {
        if (!geometry) return [];
        const polygons = geometry.type === "Polygon" ? [geometry.coordinates] : geometry.coordinates;
        return polygons.flatMap((polygon) =>
          polygon.map((ring) =>
            ring
              .map((coordinate, index) => {
                const [x, y] = project(coordinate);
                return `${index === 0 ? "M" : "L"}${x.toFixed(1)} ${y.toFixed(1)}`;
              })
              .join(" ") + " Z",
          ),
        );
      }

      function createMiniRoutePath(points) {
        if (points.length < 2) return "";
        return points
          .map((point, index) => {
            const [x, y] = point;
            if (index === 0) return `M${x.toFixed(1)} ${y.toFixed(1)}`;
            const [prevX, prevY] = points[index - 1];
            const bend = index % 2 === 0 ? 8 : -8;
            const controlX = (prevX + x) / 2;
            const controlY = (prevY + y) / 2 + bend;
            return `Q${controlX.toFixed(1)} ${controlY.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)}`;
          })
          .join(" ");
      }

      async function renderRouteMiniMap() {

        const project = getMiniMapProjector();
        const china = await loadGeoJson(`${dataRoot}/china/ChinaBoundpoly.geojson`);
        chinaLayer.innerHTML = "";
        china.features.forEach((feature) => {
          geometryToMiniPaths(feature.geometry, project).forEach((pathData) => {
            const land = document.createElementNS("http://www.w3.org/2000/svg", "path");
            land.setAttribute("class", "mini-land");
            land.setAttribute("d", pathData);
            chinaLayer.appendChild(land);
          });
        });

        const miniRouteStops = [];
        const miniStagePoints = [];
        const seenStops = new Set();
        for (const [stageIndex, stage] of stages.entries()) {
          let stagePoint = null;
          for (const placeId of stage.placeIds) {
            if (placeId === "Dingyou") continue;
            const data = await loadGeoJson(`${dataRoot}/places/${placeId}.geojson`);
            const latlng = getFeatureLatLng(data.features[0]);
            if (!latlng) continue;
            const key = `${latlng[0].toFixed(4)},${latlng[1].toFixed(4)}`;
            const point = project([latlng[1], latlng[0]]);
            if (!seenStops.has(key)) {
              miniRouteStops.push({ point, stageIndex, stageId: stage.id, placeId });
              seenStops.add(key);
            }
            stagePoint = point;
          }
          miniStagePoints.push(stagePoint);
        }
        const validPoints = miniRouteStops.map((stop) => stop.point);

        routeLayerSvg.innerHTML = "";
        const routePath = document.createElementNS("http://www.w3.org/2000/svg", "path");
        routePath.setAttribute("class", "mini-route-line");
        routePath.setAttribute("d", createMiniRoutePath(validPoints));
        routeLayerSvg.appendChild(routePath);

        pointLayer.innerHTML = "";
        miniRouteStops.forEach((stop, index) => {
          const { point, placeId, stageIndex } = stop;
          const [x, y] = point;
          const node = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          node.setAttribute("class", `mini-route-node${stageIndex === 0 ? " active" : ""}`);
          node.setAttribute("data-mini-index", String(index));
          node.setAttribute("data-stage-index", String(stageIndex));
          node.setAttribute("data-place-id", placeId);
          node.setAttribute("cx", x.toFixed(1));
          node.setAttribute("cy", y.toFixed(1));
          node.setAttribute("r", "4");
          pointLayer.appendChild(node);
        });
      }

      /*
       * 用二次贝塞尔曲线为每段行程增加轻微弧度。
       * 返回值仍是一组 Leaflet 经纬度，因此绘制路线和人物移动可共用同一条路径。
       */
      function createCurvedRoute(route, seed = 0) {
        if (route.length < 2) return route.slice();
        const curvedRoute = [];
        for (let index = 0; index < route.length - 1; index += 1) {
          const start = route[index];
          const end = route[index + 1];
          const deltaLat = end[0] - start[0];
          const deltaLng = end[1] - start[1];
          const distance = Math.hypot(deltaLat, deltaLng);
          const bendFactor = Math.min(0.14, 1.15 / Math.max(distance, 0.01));
          const direction = (seed + index) % 2 === 0 ? 1 : -1;
          const control = [
            (start[0] + end[0]) / 2 + deltaLng * bendFactor * direction,
            (start[1] + end[1]) / 2 - deltaLat * bendFactor * direction,
          ];

          for (let sample = 0; sample < 14; sample += 1) {
            const t = sample / 14;
            const oneMinusT = 1 - t;
            curvedRoute.push([
              oneMinusT * oneMinusT * start[0] + 2 * oneMinusT * t * control[0] + t * t * end[0],
              oneMinusT * oneMinusT * start[1] + 2 * oneMinusT * t * control[1] + t * t * end[1],
            ]);
          }
        }
        curvedRoute.push(route[route.length - 1]);
        return curvedRoute;
      }

      function drawCompletedRoutes(index) {

        for (let stageIndex = 0; stageIndex < index; stageIndex += 1) {

            L.polyline(createCurvedRoute(completedRoute, stageIndex), travelRouteStyle).addTo(completedRouteLayer);
          }
        }
      }

      async function activateStage(index, playFootsteps = false) {
        const stage = stages[index];
        routeLayer.clearLayers();
        activePlaceLayer.clearLayers();
        hideClassicCard();

        drawCompletedRoutes(index);

        /* 当前阶段的路线单独绘制，点击时间轴时会立即切换到对应行程。 */
        const currentRoute = stage.route.slice(0, (stage.focusIndex ?? stage.route.length - 1) + 1);
        const currentCurvedRoute = createCurvedRoute(currentRoute, index);
        if (currentRoute.length > 1) {
          L.polyline(currentCurvedRoute, travelRouteStyle).addTo(routeLayer);
        }
        /* 路线中的中间坐标只负责塑造弧度，不再画成地点圆圈。
         * 真正地点由 GeoJSON 图层统一绘制圆圈和名称，避免产生无名称的假地点。 */

        stage.placeIds.forEach(async (name) => {
          const data = await loadGeoJson(`${dataRoot}/places/${name}.geojson`);
          const latlng = getFeatureLatLng(data.features[0]);
          if (!latlng) return;
          makePlaceMarker(latlng, placeNames[name] || name, true).addTo(activePlaceLayer);
        });

        document.getElementById("storyCard").dataset.tag = stage.era;
        document.getElementById("storyTitle").textContent = stage.chapter;
        document.getElementById("storyEra").textContent = stage.era;
        document.getElementById("storyYear").textContent = `（${stage.year}）`;

        document.getElementById("storyText").textContent = stage.story;
        document.getElementById("storyImage").src = storyImages[stage.id] || "./Data/故事卡素材/1.png";
        document.getElementById("storyMeta").innerHTML = stage.tags.map((tag) => `<span>${tag}</span>`).join("");

        document.querySelectorAll(".mini-route-node").forEach((node, nodeIndex) => {
          const nodeStageIndex = Number(node.dataset.stageIndex || nodeIndex);
          node.classList.toggle("active", nodeStageIndex === index);
          node.classList.toggle("visited", nodeStageIndex < index);
        });

        if (stage.classic) {
          showClassicCard(stage.classic);
        } else {
          hideClassicCard();
        }

        if (!traveller) {
          traveller = makeTraveller(stage.route[stage.focusIndex ?? stage.route.length - 1]);
        } else {
          if (playFootsteps) startFootsteps();
          await animateTraveller(currentCurvedRoute);
          if (playFootsteps) stopFootsteps();
        }

        const currentButton = document.querySelector(".era-btn.active");
        if (!currentButton || Number(currentButton.dataset.index) !== index) return;
      }

      function animateTraveller(route) {
        cancelAnimationFrame(travellerFrame);
        const steps = [];
        for (let i = 0; i < route.length - 1; i += 1) {
          const start = route[i];
          const end = route[i + 1];
          for (let j = 0; j < 3; j += 1) {
            const t = j / 3;
            steps.push([start[0] + (end[0] - start[0]) * t, start[1] + (end[1] - start[1]) * t]);
          }
        }
        steps.push(route[route.length - 1]);

        return new Promise((resolve) => {
          let frame = 0;
          const tick = () => {
            traveller.setLatLng(steps[frame]);
            frame += 1;
            if (frame < steps.length) {
              travellerFrame = requestAnimationFrame(tick);
            } else {
              resolve();
            }
          };
          tick();
        });
      }

          ? classic.entries
          : [{ source: classic.source, heading: classic.title, quote: classic.text, translation: "" }];
        const entriesBox = document.getElementById("classicEntries");
        entriesBox.replaceChildren();
        entries.forEach((entry) => {
          const item = document.createElement("section");
          item.className = "classic-entry";

          const source = document.createElement("span");
          source.className = "classic-source";
          source.textContent = entry.source || "《水经注》";

          const heading = document.createElement("h3");
          heading.textContent = entry.heading || "山水记";

          const quote = document.createElement("p");
          quote.className = "classic-quote";
          quote.textContent = entry.quote || "";

          const translation = document.createElement("p");
          translation.className = "classic-translation";
          translation.textContent = entry.translation ? `译文：${entry.translation}` : "";

          item.append(source, heading, quote);
          if (entry.translation) item.append(translation);
          entriesBox.append(item);
        });
        const card = document.getElementById("classicCard");
        card.classList.add("is-visible");
        card.setAttribute("aria-hidden", "false");
      }

      function renderTimeline() {
        const timeline = document.getElementById("timeline");
        timeline.innerHTML = stages
          .map(
            (stage, index) => `
              <button class="era-btn ${index === 0 ? "active" : ""} ${stage.classic ? "has-classic" : ""}" type="button" data-index="${index}" aria-label="${stage.era}，${stage.year}，${stage.storyPlace}">
                <span>
                  <img class="era-art" src="${timelineArt[index]}" alt="" aria-hidden="true" />
                  <b>${stage.chapter.split("·")[1].trim()}</b>
                  <small>${stage.year}</small>
                </span>
              </button>
            `,
          )
          .join("");
        timeline.querySelectorAll(".era-btn").forEach((button) => {
          button.addEventListener("click", () => activateStage(Number(button.dataset.index), true));
        });
      }

      async function init() {
        renderTimeline();
        bindLayerToggles();
        document.getElementById("classicClose").addEventListener("click", hideClassicCard);
        await renderRouteMiniMap();
        await drawBaseLayers();
        await drawAllPlaces();
        traveller = makeTraveller(stages[0].route[stages[0].focusIndex ?? stages[0].route.length - 1]);
        activateStage(0);
      }

      init().catch((error) => {
        console.error(error);
        document.getElementById("storyText").textContent = "地图数据加载失败，请检查 GeoJSON 文件路径或本地服务器。";
      });
    </script>
  </body>
</html>
