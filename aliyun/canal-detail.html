<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>水韵江苏：京杭大运河</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#f5efe3;--ink:#302b25;--red:#b64a38;--gold:#a97931}
html,body{width:100%;height:100%;overflow:hidden;background:#e9dfcf;color:var(--ink)}
body{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
button{font:inherit}.page{position:fixed;inset:0;overflow:hidden;background:var(--paper)}
.reference-map{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}
.back{position:absolute;z-index:20;left:1.35%;top:2.4%;padding:9px 14px;text-decoration:none;color:#43392f;background:rgba(249,245,236,.93);border:1px solid rgba(136,105,69,.42);box-shadow:0 5px 15px rgba(57,39,21,.08)}
.focus-dot{position:absolute;z-index:8;left:var(--x);top:var(--y);width:15px;height:15px;border-radius:50%;transform:translate(-50%,-50%);background:#c64a35;border:3px solid #fff6e8;box-shadow:0 0 0 5px rgba(198,74,53,.16);transition:left .38s ease,top .38s ease}
.story-card{position:absolute;z-index:12;left:21.8%;top:41.6%;width:23.6%;height:38.8%;display:flex;flex-direction:column;padding:24px 25px 18px;background:linear-gradient(180deg,rgba(249,245,236,.99),rgba(246,239,226,.965));border:1px solid rgba(153,119,75,.46);outline:1px solid rgba(190,165,124,.32);outline-offset:-7px;border-radius:6px;box-shadow:0 12px 26px rgba(58,42,27,.2),inset 0 0 28px rgba(255,252,243,.4);overflow:visible}
.story-card::after{content:"×";position:absolute;right:10px;top:8px;color:rgba(96,83,67,.52);font-size:24px;line-height:1;font-family:Arial,sans-serif}
.story-card::before{content:"‹";position:absolute;left:14px;bottom:18px;color:rgba(92,82,70,.48);font-size:34px;line-height:1;font-family:Georgia,serif}
.story-head{position:relative;display:flex;align-items:flex-start;gap:10px;margin-bottom:7px}.story-seal{position:absolute;left:-18px;top:-25px;width:31px;height:41px;display:grid;place-items:center;background:#aa4b35;color:#fff3df;font-size:12px;line-height:1.05;box-shadow:0 3px 6px rgba(95,54,31,.16)}.story-title{font-size:17px;line-height:1.28;color:#2e2923;padding-left:6px}.divider{height:1px;background:linear-gradient(90deg,rgba(172,128,75,.18),#aa8758,rgba(172,128,75,.18));margin:0 4px 8px}
.summary{font-size:11.5px;line-height:1.62;color:#51483f}.points{display:none}
.story-art{margin-top:auto;width:112%;height:43%;object-fit:cover;object-position:center 58%;transform:translateX(-4%);filter:saturate(.68) sepia(.12) contrast(.9);opacity:.78}
.pager{position:relative;display:flex;justify-content:center;gap:8px;margin-top:5px}.pager::after{content:"›";position:absolute;right:3px;bottom:-9px;color:rgba(92,82,70,.48);font-size:34px;line-height:1;font-family:Georgia,serif}.pager i{width:9px;height:9px;border-radius:50%;background:#c9c1b3}.pager i.active{background:#b8573c}
.timeline{position:absolute;z-index:14;left:21.5%;right:2.2%;bottom:2.6%;height:12.8%;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.era-btn{position:relative;display:block;padding:0;border:0;border-radius:0;background:transparent;color:transparent;text-align:left;cursor:pointer;box-shadow:none;overflow:visible;transition:transform .22s ease,filter .22s ease}.era-btn::after{content:"";position:absolute;inset:9% 6%;border-radius:14px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,241,202,.55),rgba(255,255,255,0));opacity:0;pointer-events:none;mix-blend-mode:screen;transition:opacity .22s ease}.era-btn:hover{transform:translateY(-4px);filter:drop-shadow(0 10px 16px rgba(86,59,31,.16))}.era-btn:hover::after{opacity:.5}.era-btn.active{transform:translateY(-3px);filter:drop-shadow(0 0 7px rgba(183,104,67,.36)) drop-shadow(0 9px 15px rgba(93,61,30,.16))}.era-btn.active::after{opacity:.72}
.era-icon{width:100%;height:100%;display:block;object-fit:contain;filter:none}.era-btn span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
@media(max-width:1250px){.story-card{padding:14px 15px 10px}.story-head{margin-bottom:5px}.story-title{font-size:14px;line-height:1.25}.divider{margin-bottom:6px}.summary{font-size:9.5px;line-height:1.4}.story-art{height:24%}.pager{display:none}.points span{font-size:8.5px}.timeline{gap:8px}}
</style>
</head>
<body>
<main class="page">
 <img class="reference-map" src="../Data/参考/运河3.png" alt="京杭大运河江苏段国风叙事地图">
 <a class="back" href="Map_前景.html?view=map">返回三水总图</a>
 <div class="focus-dot" id="focusDot" aria-hidden="true"></div>
 <section class="story-card" id="storyCard" aria-live="polite"></section>
 <nav class="timeline" id="timeline" aria-label="运河历史阶段"></nav>
</main>
<script>
const ERAS=[
 {id:'foundation',period:'先秦—隋唐',tag:'先秦隋唐',title:'运河奠基，江淮商业率先崛起',summary:'从邗沟到隋代贯通，大运河把长江、淮河和江南水网接入王朝交通体系。扬州因漕运和盐商兴起，成为早期全国性商贸都会。',points:['前486年夫差开挖邗沟','隋代贯通大运河','唐代扬州商贸兴盛'],x:'53%',y:'47%',art:'assets/redrawn-architecture-hd/06_ancient_sluice.png',buttonArt:'assets/9.png'},
 {id:'songYuan',period:'宋 元',tag:'宋元',title:'江南运河繁荣，工商业市镇兴起',summary:'江南运河疏浚后，苏锡常市镇沿河扩张。粮、丝、盐、陶瓷和日用品顺水转输，平望、望亭、浒墅关等市镇因河而生。',points:['江南运河全线疏浚','沿河市镇密集生长','淮安成为十字枢纽'],x:'61%',y:'57%',art:'assets/redrawn-architecture-hd/01_jiangnan_arch_bridge.png',buttonArt:'assets/10.png'},
 {id:'mingQing',period:'明 清',tag:'明清',title:'漕运鼎盛，塑造数百年经济格局',summary:'明清时期，大运河承担国家漕粮、盐业和商贸大循环。淮安清江浦、扬州、无锡、苏州成为运河商埠，钞关、仓廪和码头改变城市形态。',points:['漕粮盐业全国流通','四大商埠沿河兴盛','商帮钱庄牙行发展'],x:'62%',y:'59%',art:'assets/redrawn-architecture-hd/04_canal_wharf.png',buttonArt:'assets/11.png'},
 {id:'modern',period:'近 代',tag:'近代',title:'运河的衰落与转型',summary:'清末黄河改道、漕运废止、铁路兴起，传统运河城市经历衰落。但江苏段仍依靠民间货运和区域物资运输维持生命力。',points:['漕运废止城市转型','铁路重构运输体系','苏北运河继续货运'],x:'71%',y:'69%',art:'assets/redrawn-architecture-hd/07_river_port_town.png',buttonArt:'assets/12.png'},
 {id:'today',period:'当 代',tag:'当代',title:'现代黄金水道，内河航运世界第一',summary:'当代运河兼具航运、调水、遗产和文旅功能。它连接长江水源、太湖水网和北方调水需求，成为三水交织的现代工程廊道。',points:['全年通航货运繁忙','南水北调东线通道','古运河与现代航运并行'],x:'85%',y:'76%',art:'assets/redrawn-architecture-hd/02_city_gate_wall.png',buttonArt:'assets/13.png'}
];

let current='mingQing';
const storyCard=document.getElementById('storyCard'),timeline=document.getElementById('timeline'),focusDot=document.getElementById('focusDot');
function render(){const era=ERAS.find(e=>e.id===current)||ERAS[0];focusDot.style.setProperty('--x',era.x);focusDot.style.setProperty('--y',era.y);storyCard.innerHTML=`<div class="story-head"><span class="story-seal">${era.tag}</span><h2 class="story-title">${era.title}</h2></div><div class="divider"></div><p class="summary">${era.summary}</p><div class="points">${era.points.map(p=>`<span>${p}</span>`).join('')}</div><img class="story-art" src="${era.art}" alt="${era.title}建筑意象"><div class="pager">${ERAS.map(e=>`<i class="${e.id===current?'active':''}"></i>`).join('')}</div>`;timeline.innerHTML=ERAS.map(e=>`<button class="era-btn ${e.id===current?'active':''}" data-era="${e.id}"><img class="era-icon" src="${e.buttonArt}" alt=""><span><b>${e.period}</b><small>${e.title}</small></span></button>`).join('');timeline.querySelectorAll('.era-btn').forEach(btn=>btn.addEventListener('click',()=>{current=btn.dataset.era;render()}))}
render();
</script>
</body>
</html>
