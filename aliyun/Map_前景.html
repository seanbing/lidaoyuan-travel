<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水韵江苏：江河奔流里的人文千年</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--paper:#f5efe3;--ink:#2d2924;--seal:#a8392d;--gold:#a97931}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink)}
  body{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
  button{font:inherit}
  .stage{position:fixed;inset:0;overflow:hidden;background:#eee5d5}
  .plate{position:absolute;inset:0;transition:opacity .65s ease,visibility .65s ease,transform .8s ease}
  .plate img{width:100%;height:100%;display:block;object-fit:cover;object-position:center}
  .cover{z-index:5;background:#eee5d5}
  .cover::before{content:"";position:absolute;inset:0;background:url("../Data/参考/封面2.png") center/cover no-repeat}
  .cover>img{display:none}
  .cover.is-hidden{opacity:0;visibility:hidden;transform:scale(1.025);pointer-events:none}
  .overview{z-index:1;background:#f5efe3}
  .enter-btn{position:absolute;left:50%;top:72.4%;transform:translate(-50%,-50%);width:min(338px,23vw);aspect-ratio:338/82;border:0;background:url("../Data/参考/要素/封面按钮.png") center/contain no-repeat;color:transparent;cursor:pointer;filter:drop-shadow(0 12px 20px rgba(37,58,48,.22));transition:filter .2s ease,transform .2s ease}
  .enter-btn:hover,.enter-btn:focus-visible{filter:drop-shadow(0 16px 26px rgba(37,58,48,.28)) brightness(1.05);transform:translate(-50%,-54%)}
  .overview img{object-fit:contain;object-position:center;background:#f5efe3}
  .hotspot{position:absolute;border:1px solid transparent;background:transparent;cursor:pointer;color:transparent;transition:border-color .2s ease,background .2s ease,box-shadow .2s ease}
  .hotspot:hover,.hotspot:focus-visible{border-color:rgba(168,57,45,.55);background:rgba(255,248,229,.12);box-shadow:0 0 0 5px rgba(255,250,239,.18),0 12px 28px rgba(64,43,20,.12)}
  .hotspot::after{content:attr(data-label);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);padding:7px 12px;white-space:nowrap;background:rgba(52,43,32,.88);color:#fffaf0;font-size:14px;letter-spacing:.08em;opacity:0;pointer-events:none;transition:opacity .18s ease}
  .hotspot:hover::after,.hotspot:focus-visible::after{opacity:1}
  .tab-yangtze,.tab-canal,.tab-taihu{left:auto;right:12%;width:min(210px,12.7vw);height:auto;aspect-ratio:1983/793;border:0;background-position:center;background-size:contain;background-repeat:no-repeat;filter:drop-shadow(0 8px 14px rgba(74,52,28,.1));transition:filter .22s ease,transform .22s ease}
  .tab-yangtze{top:16%;background-image:url("assets/1.png")}
  .tab-canal{top:26%;background-image:url("assets/2.png")}
  .tab-taihu{top:36%;;background-image:url("assets/3.png")}
  .tab-yangtze:hover,.tab-yangtze:focus-visible,.tab-canal:hover,.tab-canal:focus-visible,.tab-taihu:hover,.tab-taihu:focus-visible{border-color:transparent;background-color:transparent;box-shadow:none;filter:drop-shadow(0 16px 24px rgba(74,52,28,.18)) brightness(1.03);transform:translateX(-4px)}
  .tab-yangtze::after,.tab-canal::after,.tab-taihu::after{display:none}
  .map-yangtze{left:24%;top:45%;width:55%;height:16%;clip-path:polygon(0 30%,20% 22%,39% 38%,58% 28%,78% 44%,100% 25%,100% 78%,80% 90%,60% 72%,38% 84%,18% 68%,0 76%)}
  .map-canal{left:49%;top:15%;width:18%;height:42%;clip-path:polygon(34% 0,62% 0,58% 35%,69% 67%,55% 100%,34% 100%,44% 65%,37% 34%)}
  .map-taihu{left:39%;top:58%;width:26%;height:24%;border-radius:48%}
  .corner-seal{position:absolute;right:22px;bottom:20px;width:42px;height:42px;border:2px solid rgba(168,57,45,.72);color:var(--seal);display:grid;place-items:center;font-size:13px;line-height:1.1;background:rgba(246,240,228,.4);transform:rotate(-3deg);pointer-events:none}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  @media (max-aspect-ratio:4/3){
    .plate img{object-fit:cover}
    .overview img{object-fit:contain;object-position:center}
    .hotspot::after{display:none}
  }
</style>
</head>
<body>
<main class="stage">
  <section class="plate overview" aria-label="江苏三水总览">
    <img src="../Data/参考/总览图.png" alt="水韵江苏三水总览国风地图">
    <button class="hotspot tab-yangtze" data-label="进入长江详情" data-target="changjiang-detail.html"><span class="sr-only">进入长江详情</span></button>
    <button class="hotspot tab-canal" data-label="进入京杭大运河详情" data-target="canal-detail.html"><span class="sr-only">进入京杭大运河详情</span></button>
    <button class="hotspot tab-taihu" data-label="进入太湖水系详情" data-target="taihu-detail.html"><span class="sr-only">进入太湖水系详情</span></button>
    <button class="hotspot map-yangtze" data-label="长江：江海主轴" data-target="changjiang-detail.html"><span class="sr-only">进入长江详情</span></button>
    <button class="hotspot map-canal" data-label="京杭大运河：南北纽带" data-target="canal-detail.html"><span class="sr-only">进入京杭大运河详情</span></button>
    <button class="hotspot map-taihu" data-label="太湖水系：江南腹地" data-target="taihu-detail.html"><span class="sr-only">进入太湖水系详情</span></button>
    <div class="corner-seal" aria-hidden="true">水韵<br>江苏</div>
  </section>

  <section class="plate cover" id="cover" aria-label="网站封面">
    <img src="../Data/参考/封面2.png" alt="水韵江苏：江河奔流里的人文千年">
    <button class="enter-btn" id="enterBtn" type="button"><span class="sr-only">进入探索</span></button>
  </section>
</main>
<script>
const cover = document.getElementById('cover');
const enterBtn = document.getElementById('enterBtn');
function enterOverview(){ cover.classList.add('is-hidden'); }
enterBtn.addEventListener('click', enterOverview);
document.querySelectorAll('[data-target]').forEach(button => {
  button.addEventListener('click', () => { window.location.href = button.dataset.target; });
});
if(new URLSearchParams(window.location.search).get('view') === 'map') enterOverview();
</script>
</body>
</html>
